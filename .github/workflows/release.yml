# origin/master の先端でリリースする。
# patch / minor / major に応じて package.json の版修正、タグ作成、zip 付きの Release を作る。

name: リリース作成

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 版の上げ方
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: release-master
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: master の先端を取得
        uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0

      - name: Node.js を用意
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: npm

      - name: 依存関係インストール
        run: npm ci

      - name: 型チェック
        run: npm run compile

      - name: Git作者を設定
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: 版を上げる
        id: version
        run: |
          set -euo pipefail
          release_tag="$(npm version "${{ inputs.bump }}" -m "v%s")"
          echo "version=${release_tag#v}" >> "$GITHUB_OUTPUT"
          echo "tag=${release_tag}" >> "$GITHUB_OUTPUT"

      - name: zip生成
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          npm run zip
          chrome_zip="dist/teamspirit-autofill-${PACKAGE_VERSION}-chrome.zip"
          if [ ! -f "$chrome_zip" ]; then
            echo "zip が見つかりません: ${chrome_zip}"
            exit 1
          fi

      - name: リリースノートを作る
        run: |
          set -euo pipefail
          previous_release_tag="$(git describe --tags --abbrev=0 HEAD^)"
          # 版上げコミットの題名は版番号そのものなので、ノートには含めない。
          git log "${previous_release_tag}..HEAD^" --pretty=format:%s > release-notes.txt

      - name: 版のコミットとタグをpush
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git push --atomic origin HEAD:master "refs/tags/${RELEASE_TAG}"

      - name: GitHub Release を作る
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            "dist/teamspirit-autofill-${PACKAGE_VERSION}-chrome.zip" \
            --title "$RELEASE_TAG" \
            --notes-file release-notes.txt
